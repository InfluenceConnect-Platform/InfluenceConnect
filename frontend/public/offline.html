<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Influence Connect</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0E1B2E;
    color: #F1F5F9;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  .mark {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #3FA34D, #14531D);
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    box-shadow: 0 10px 40px -8px rgba(63, 163, 77, 0.55);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  p { font-size: 14px; color: #94A3B8; margin: 0; max-width: 320px; line-height: 1.5; }
  button {
    margin-top: 6px;
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #3FA34D, #14531D);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">IC</div>
  <h1>You're offline</h1>
  <p>Influence Connect needs a connection to load campaigns, messages, and deals. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
